<!DOCTYPE html>
<html lang="en">
<head>
    <title>Operators</title>
</head>
<body>
    <h1>Operators</h1>
    <p>I am going to multiply 2 numbers together.</p>
    <p id="multi">The answer is...</p>
    <script>
        var a=11;// first statement
        var b=7;// second statment
        var c = a*b;//third statement
        document.getElementById("multi").innerHTML="The product of the both numbers is "+c;//changing the content of html element
    </script>
</body>
</html>
