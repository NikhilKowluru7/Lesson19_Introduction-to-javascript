<!DOCTYPE html>
<html lang="en">
<head>
    <title>Variables</title>
</head>
<body>
    <h1>Javascript variables</h1>
    <p id="sum">The sum of 2 numbers.</p>
    <p id="num">The sum is</p>
    <script>
        var num1 = 10;
        var num2 = 12;
        var sum = num1+num2;
        document.getElementById("num").innerHTML="The total sum of the 2 numbers is "+sum;
    </script>
</body>
</html>
